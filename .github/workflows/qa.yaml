name: QA
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  qa:
    name: Run QA checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc
        run: sudo apt install -y pandoc
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install the world
        run: |
          uv python install
          uv sync
      - name: Run linting
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run validate-pyproject ./pyproject.toml
      - name: Run mypy
        run: uv run mypy ./src ./tests
      - name: Run tests
        run: uv run pytest -vvv ./tests
